# Single entry point: Subsonic endpoints that octo-fiesta augments go to it, nori's web client is served
# from its files, everything else (navidrome's UI at /app/, native API, SSE events, the remaining Subsonic
# API) goes straight to navidrome.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # No access log: saves flash writes and CPU; navidrome and octo-fiesta log requests themselves.
    access_log off;
    server_tokens off;

    # Works when the container runs as a non-root user.
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    tcp_nodelay on;
    keepalive_timeout 75s;
    # Uploads (navidrome's /api/upload) are streamed through without a size cap.
    client_max_body_size 0;

    # Keep what an outer reverse proxy already set, otherwise fill it in ourselves.
    map $http_x_forwarded_proto $fwd_proto {
        ""      $scheme;
        default $http_x_forwarded_proto;
    }
    # Cloudflare Tunnel sends the client address as CF-Connecting-IP.
    map $http_cf_connecting_ip $peer_ip {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }
    map $http_x_real_ip $fwd_real_ip {
        ""      $peer_ip;
        default $http_x_real_ip;
    }
    map $http_x_forwarded_host $fwd_host {
        ""      $http_host;
        default $http_x_forwarded_host;
    }
    # Empty Connection header keeps upstream connections alive; "upgrade" for websockets.
    map $http_upgrade $connection_upgrade {
        ""      "";
        default upgrade;
    }

    upstream navidrome {
        server 127.0.0.1:4534;
        keepalive 16;
    }
    upstream octo_fiesta {
        server 127.0.0.1:5274;
        keepalive 16;
    }

    server {
        listen 4533 default_server;

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header X-Real-IP         $fwd_real_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host  $fwd_host;

        # Streams, SSE and uploads must not be buffered to disk.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Every route octo-fiesta's SubsonicController overrides; its catch-all only relays to navidrome.
        location ~ ^/rest/(search3|stream|getSong|getAlbum|getArtist|getTopSongs|getCoverArt|getLyricsBySongId|getTranscodeDecision|reportPlayback|scrobble|star|unstar|updatePlaylist)(\.view)?$ {
            proxy_pass http://octo_fiesta;
        }

        # nori's web client: its page at /, its files where they are; any other path is navidrome's.
        location = / {
            root /srv/nori-web;
            try_files /index.html =404;
        }
        location / {
            root /srv/nori-web;
            try_files $uri @navidrome;
        }
        location @navidrome {
            proxy_pass http://navidrome;
        }
    }
}
