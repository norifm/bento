name: docker

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Picks up new builds of the navidrome and octo-fiesta forks.
  schedule:
    - cron: "30 4 * * *"
  # Lets the fork pipelines trigger a rebuild (needs a token with repo scope on their side).
  repository_dispatch:
    types: [upstream-updated]

concurrency:
  group: docker
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/navi-fiesta

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve octo-fiesta revision
        id: octo
        run: echo "sha=$(git ls-remote https://github.com/filipton/octo-fiesta.git refs/heads/dev | cut -c1-40)" >> "$GITHUB_OUTPUT"

      # amd64 and arm64 both build natively on the x86 runner: navidrome comes prebuilt and
      # octo-fiesta is cross-compiled by the .NET SDK, so no QEMU is involved.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: |
            OCTO_REF=${{ steps.octo.outputs.sha }}
            OCTO_VERSION=0.0.0-${{ steps.octo.outputs.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
